name: Phase 0 Source Safety

on:
  push:
    branches: [recovery/system-stabilization-2026-11]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-safety:
    if: ${{ github.event_name == 'push' || github.head_ref == 'recovery/system-stabilization-2026-11' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check phase 0 migration baseline and project safety
        run: node scripts/recovery/phase0-verify.mjs --ci
      - name: Test destructive-E2E guard
        run: node --experimental-strip-types --test scripts/recovery/phase0-safety.node.test.mjs
      - name: Confirm no destructive browser tests run in this workflow
        run: echo 'Offline checks only. Cloud backup and isolation gates require separate verification.'
