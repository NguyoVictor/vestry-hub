name: P1 P2 Quality

on:
  pull_request:
  push:
    branches: [main, p1-stabilization-hardening, b-batch-infrastructure-qa, recovery/system-stabilization-2026-11]

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: P2 dependency-free contracts
        run: npm run test:p2:contracts
      - name: P1 focused contracts
        run: |
          npm run test:p1:people
          npm run test:p1:operations
          npm run test:p1:engagement
          npm run test:p1:analytics
          npm run test:p1:analytics:contract
      - name: Phase 1 read-only browser safety guard (offline)
        run: node --test scripts/qa/staging-readonly-guard.node.test.mjs
      - name: Discover real browser smoke tests (not executed in CI)
        env:
          PW_STAGING_READONLY: '1'
          PW_STAGING_BASE_URL: https://vestry-hub-git-recovery-example.vercel.app
          PW_STAGING_ALLOWED_HOST: vestry-hub-git-recovery-example.vercel.app
          PW_STAGING_SUPABASE_URL: https://xwbajophstetbnnemsyq.supabase.co
        run: npx playwright test --config playwright.staging-readonly.config.ts --list
      - name: Prevent Supabase client hard-coded backend regression
        run: |
          node scripts/qa/check-supabase-client-source.mjs
          node --test scripts/qa/check-supabase-client-source.node.test.mjs
      - name: Production build
        run: npm run build
      - name: TypeScript check
        run: npx tsc --noEmit

  # F-CI-1: the root tsconfig has `files: []`, so `npx tsc --noEmit` above checks
  # nothing. This job type-checks the real app project. It is informational
  # (continue-on-error) only until the first run establishes the true error
  # baseline; Phase 1 must fix those errors and then make this job blocking.
  app-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check app project (tsconfig.app.json)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx tsc -p tsconfig.app.json --noEmit

  # Phase 1B.2: staff invitation handshake (blocking). The PGlite harness replays
  # the real trigger migrations on in-process Postgres — no network database.
  staff-invite-handshake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Staff invitation source contract
        run: node scripts/recovery/check-staff-invite-handshake.mjs
      - name: Staff invitation unit tests
        run: node --experimental-strip-types --test scripts/recovery/staff-invite-handshake.node.test.mjs
      - name: Trigger behavior on in-process Postgres (pre -> V1 -> V2)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pglite" @electric-sql/pglite@0.2.17
          PGLITE_MODULE="$RUNNER_TEMP/pglite/node_modules/@electric-sql/pglite/dist/index.js" \
            node --test scripts/recovery/p1b2-staff-binding-pglite-harness.mjs
      - name: Member portal provisioning trigger behavior (Finding 1, pre -> V1 -> V2 -> P2)
        run: |
          PGLITE_MODULE="$RUNNER_TEMP/pglite/node_modules/@electric-sql/pglite/dist/index.js" \
            node --test scripts/recovery/p2-member-provisioning-pglite-harness.mjs
      - name: Member portal provisioning unit tests
        run: node --experimental-strip-types --test scripts/recovery/member-portal-provisioning.node.test.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  platform-e2e:
    # Temporarily disabled: Production and Preview currently share the same Supabase project.
    # Restore only after isolated destructive E2E targets and a reviewed CI gate exist.
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      PW_PLATFORM_TEST_ENV: ${{ secrets.PW_PLATFORM_TEST_ENV }}
      PW_TENANT_A_ID: ${{ secrets.PW_TENANT_A_ID }}
      PW_TENANT_B_ID: ${{ secrets.PW_TENANT_B_ID }}
      PW_TENANT_A_SLUG: ${{ secrets.PW_TENANT_A_SLUG }}
      PW_TENANT_B_SLUG: ${{ secrets.PW_TENANT_B_SLUG }}
      PW_BASE_URL: ${{ secrets.PW_BASE_URL }}
      PW_SUPABASE_URL: ${{ secrets.PW_SUPABASE_URL }}
      PW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PW_SUPABASE_SERVICE_ROLE_KEY }}
      PW_SUPABASE_ANON_KEY: ${{ secrets.PW_SUPABASE_ANON_KEY }}
      PW_TENANT_A_ADMIN_ACCESS_TOKEN: ${{ secrets.PW_TENANT_A_ADMIN_ACCESS_TOKEN }}
      PW_TENANT_B_ADMIN_ACCESS_TOKEN: ${{ secrets.PW_TENANT_B_ADMIN_ACCESS_TOKEN }}
      PW_MEMBER_A_ACCESS_TOKEN: ${{ secrets.PW_MEMBER_A_ACCESS_TOKEN }}
      PW_MEMBER_B_ACCESS_TOKEN: ${{ secrets.PW_MEMBER_B_ACCESS_TOKEN }}
      PW_FULL_ADMIN_STORAGE_STATE: ${{ secrets.PW_FULL_ADMIN_STORAGE_STATE }}
      PW_READ_ONLY_ADMIN_STORAGE_STATE: ${{ secrets.PW_READ_ONLY_ADMIN_STORAGE_STATE }}
      PW_NO_PERMISSION_ADMIN_STORAGE_STATE: ${{ secrets.PW_NO_PERMISSION_ADMIN_STORAGE_STATE }}
      PW_MEMBER_A_STORAGE_STATE: ${{ secrets.PW_MEMBER_A_STORAGE_STATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:platform
