project_id = "xwbajophstetbnnemsyq"

[functions.payment-webhook]
verify_jwt = false
[functions.subscription-payment-webhook]
verify_jwt = false

[functions.c2b-webhook]
verify_jwt = false

[functions.process-email-queue]
verify_jwt = false

[functions.process-sms-queue]
verify_jwt = false

# Member Portal uses its own opaque session token rather than a Supabase Auth JWT.
# The function validates that token against the server-only member_sessions table.
[functions.member-session-context]
verify_jwt = false

# Supports both Supabase-authenticated Admin users and opaque Member Portal sessions.
# The function performs its own session validation before using service-role access.
[functions.register-device-token]
verify_jwt = false

# Staff invitations require a signed-in Supabase Auth user and server-side role checks.
[functions.send-invitation]
verify_jwt = true

# Member login requires a verified Supabase Auth JWT from email OTP.
# NEVER make this endpoint callable with an anonymous public key alone.
[functions.member-login]
verify_jwt = true

# Logout authenticates the opaque member token inside the function.
[functions.member-logout]
verify_jwt = false

# Finding 1: admin-triggered member portal provisioning; requires the admin's
# Supabase Auth JWT, then re-checks role and tenant server-side.
[functions.member-provision-access]
verify_jwt = true

# Finding 1, login step 5: public (pre-authentication) by design. The browser's
# sb_publishable_ key is not a JWT, so gateway JWT checks would reject every
# call. Returns a generic, time-padded reply; never creates users (OTP
# shouldCreateUser:false) and never grants a session by itself.
[functions.member-otp-request]
verify_jwt = false
